<!DOCTYPE html>
<html data-bs-theme="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Providence Hostel - Portal</title>
    <link rel="canonical" href="https://yourusername.github.io/providence-hostel/">
    <meta property="og:url" content="https://yourusername.github.io/providence-hostel/">
    <meta name="twitter:image" content="https://yourusername.github.io/providence-hostel/assets/img/hostel-icon-180x180.png">
    <meta name="twitter:description" content="Providence Hostel resident portal - Access guiding principles, announcements, and billing information in one convenient location">
    <meta name="twitter:title" content="Providence Hostel Portal">
    <meta name="description" content="Providence Hostel resident portal provides easy access to guiding principles, announcements, and billing information for all residents">
    <meta property="og:image" content="https://yourusername.github.io/providence-hostel/assets/img/hostel-icon-180x180.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Providence Hostel - Resident Portal">
    <meta name="keywords" content="providence hostel, hostel portal, resident billing, hostel announcements">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/assets/img/hostel-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/hostel-icon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/hostel-icon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/hostel-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/hostel-icon-512x512.png">
    
    <!-- Bootstrap CSS (optional - only if you want a loading screen) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ede8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-logo {
            font-size: 3rem;
            font-weight: 700;
            color: #1a4d2e;
            margin-bottom: 1rem;
            font-family: Georgia, serif;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #1a4d2e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 1rem;
            color: #6c757d;
            font-size: 0.9rem;
        }

        /* iframe */
        #hostel-portal {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Error Message */
        .error-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            z-index: 10000;
        }

        .error-container.show {
            display: block;
        }

        .error-container h3 {
            color: #e63946;
            margin-bottom: 1rem;
        }

        .error-container p {
            color: #6c757d;
            margin-bottom: 1.5rem;
        }

        .retry-btn {
            background: #1a4d2e;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .retry-btn:hover {
            background: #4f772d;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-logo">Providence Hostel</div>
        <div class="loader"></div>
        <div class="loading-text">Loading portal...</div>
    </div>

    <!-- Error Container -->
    <div id="error-container" class="error-container">
        <h3>⚠️ Connection Error</h3>
        <p>Unable to load the Providence Hostel portal. Please check your internet connection and try again.</p>
        <button class="retry-btn" onclick="location.reload()">Retry</button>
    </div>

    <!-- Main Portal iframe -->
    <iframe 
        id="hostel-portal"
        src="https://script.google.com/macros/s/AKfycbxrFRrgR8KNrQ4NczZ2rKv1T-_DNsCBbJ88cHwYhhf7bOenEP_zbLSHknDwhXtPEZRJYQ/exec"
        title="Providence Hostel Portal"
        allow="clipboard-read; clipboard-write"
        loading="eager">
    </iframe>

    <script>
        // Configuration
        const LOADING_MIN_TIME = 1000; // Minimum time to show loading screen (ms)
        const TIMEOUT_DURATION = 15000; // Show error after 15 seconds

        // Track loading start time
        const loadStartTime = Date.now();
        let hasLoaded = false;

        // Get elements
        const loadingScreen = document.getElementById('loading-screen');
        const errorContainer = document.getElementById('error-container');
        const iframe = document.getElementById('hostel-portal');

        // Hide loading screen when iframe loads
        iframe.addEventListener('load', function() {
            const loadTime = Date.now() - loadStartTime;
            const remainingTime = Math.max(0, LOADING_MIN_TIME - loadTime);

            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                hasLoaded = true;
            }, remainingTime);
        });

        // Show error if loading takes too long
        setTimeout(() => {
            if (!hasLoaded) {
                loadingScreen.classList.add('hidden');
                errorContainer.classList.add('show');
            }
        }, TIMEOUT_DURATION);

        // Handle iframe errors
        iframe.addEventListener('error', function() {
            loadingScreen.classList.add('hidden');
            errorContainer.classList.add('show');
        });

        // Prevent right-click on iframe (optional security)
        iframe.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // Log page view (optional - for analytics)
        console.log('Providence Hostel Portal loaded at:', new Date().toISOString());
    </script>

    <!-- Optional: Bootstrap JS (only if needed) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
